# =============================================================================
# 🚀 STACK IA OPTIMISÉE POUR DOKPLOY - Configuration
# =============================================================================
# Mutualisation maximale : Supabase, S3 Infomaniak, OpenAI Infomaniak
# Domaines : https://{{serviceName}}.ai.nos.bzh
# =============================================================================

[variables]
# Domaine principal
main_domain = "${domain}"

# ============================================================================
# 🔐 SECRETS GÉNÉRÉS AUTOMATIQUEMENT
# ============================================================================
postgres_password = "${password:32}"
jwt_secret = "${base64:64}"
secret_key_base = "${base64:64}"
anon_key = "${base64:32}"
service_role_key = "${base64:32}"
logflare_api_key = "${base64:32}"
nextauth_secret = "${base64:32}"
meili_master_key = "${password:32}"
webui_secret_key = "${base64:32}"
flowise_secret_key = "${password:32}"
flowise_passphrase = "${password:16}"
dify_secret_key = "${base64:32}"
drone_rpc_secret = "${base64:32}"
vault_enc_key = "${base64:32}"
surreal_password = "${password:16}"
grafana_admin_password = "${password:16}"
admin_password = "${password:16}"
dashboard_password = "${password:16}"
huly_secret = "${base64:32}"
hoppscotch_encryption_key = "${base64:32}"
docmost_secret = "${base64:32}"
umami_secret = "${base64:32}"
glean_secret_key = "${base64:32}"
milvus_minio_access_key = "${password:16}"
milvus_minio_secret_key = "${password:32}"

# ============================================================================
# 🌐 DOMAINES DES SERVICES
# ============================================================================


[config.env]
S3_ENDPOINT = "https://s3.pub1.infomaniak.cloud"
S3_REGION = "eu-west-1"
S3_BUCKET = "dokploy"
S3_ACCESS_KEY_ID = "${{project.S3_ACCESS_KEY_ID}}"
S3_SECRET_ACCESS_KEY = "${{project.S3_SECRET_ACCESS_KEY}}"
INFOMANIAK_PROJECT_ID = "${{project.INFOMANIAK_PROJECT_ID}}"
OPENAI_API_BASE = "https://api.infomaniak.com/2/ai/${INFOMANIAK_PROJECT_ID}/openai/v1"
OPENAI_API_KEY = "${{project.OPENAI_API_KEY}}"
POSTGRES_PASSWORD = "${postgres_password}"
POSTGRES_DB = "postgres"
JWT_SECRET = "${jwt_secret}"
SECRET_KEY_BASE = "${secret_key_base}"
VAULT_ENC_KEY = "${vault_enc_key}"
ANON_KEY = "${anon_key}"
SERVICE_ROLE_KEY = "${service_role_key}"
LOGFLARE_API_KEY = "${logflare_api_key}"
PGRST_DB_SCHEMAS = "public,storage,graphql_public"
SUPABASE_PUBLIC_URL = "https://api.${main_domain}"
API_EXTERNAL_URL = "https://api.${main_domain}"
SITE_URL = "https://${main_domain}"
DASHBOARD_USERNAME = "admin"
DASHBOARD_PASSWORD = "${dashboard_password}"
STUDIO_DEFAULT_ORGANIZATION = "IA Stack"
STUDIO_DEFAULT_PROJECT = "ia-stack"
STORAGE_BACKEND = "s3"

[[config.mounts]]
volumeName = "supabase-db-data"
